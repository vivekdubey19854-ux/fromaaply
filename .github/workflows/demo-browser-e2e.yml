name: Local Demo Browser E2E

on:
  push:
    paths:
      - "backend/**"
      - "demo-target-site/**"
      - ".github/workflows/demo-browser-e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "demo-target-site/**"
      - ".github/workflows/demo-browser-e2e.yml"

jobs:
  browser-e2e:
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      FORMWISE_ENVIRONMENT: development
      FORMWISE_BROWSER_ALLOW_LOCAL_DEMO_TARGET: "true"
      FORMWISE_BROWSER_DEMO_TARGET_PORT: "5000"
      FORMWISE_BROWSER_BLOCK_PRIVATE_NETWORKS: "true"
      FORMWISE_BROWSER_HEADLESS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install demo target
        working-directory: demo-target-site
        run: npm install

      - name: Start demo target
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP "formwise-demo-e2e.log"

          Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c npm start > `"$log`" 2>&1" `
            -WorkingDirectory "$env:GITHUB_WORKSPACE\demo-target-site" `
            -WindowStyle Hidden

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1

            try {
              $connection = Test-NetConnection `
                -ComputerName "127.0.0.1" `
                -Port 5000 `
                -WarningAction SilentlyContinue

              if ($connection.TcpTestSucceeded) {
                $ready = $true
                break
              }
            } catch {
              # Keep waiting for the demo server.
            }
          }

          if (-not $ready) {
            Write-Host "Demo target failed to start."
            if (Test-Path $log) {
              Get-Content $log
            }
            exit 1
          }

          Write-Host "Demo target is ready on port 5000."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run browser E2E test
        run: python -m pytest -q tests/test_demo_browser.py

      - name: Demo target log
        if: always()
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP "formwise-demo-e2e.log"

          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Host "Demo target log not found."
          }
