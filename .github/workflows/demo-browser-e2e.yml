name: Local Demo Browser E2E

on:
  push:
    paths:
      - "backend/**"
      - "demo-target-site/**"
      - ".github/workflows/demo-browser-e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "demo-target-site/**"
      - ".github/workflows/demo-browser-e2e.yml"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      FORMWISE_ENVIRONMENT: development
      FORMWISE_BROWSER_ALLOW_LOCAL_DEMO_TARGET: "true"
      FORMWISE_BROWSER_DEMO_TARGET_PORT: "5000"
      FORMWISE_BROWSER_BLOCK_PRIVATE_NETWORKS: "true"
      FORMWISE_BROWSER_HEADLESS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install demo target
        working-directory: demo-target-site
        run: npm install

      - name: Start demo target
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/formwise-demo-e2e.log" 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/formwise-demo-e2e.log"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run browser E2E test
        run: python -m pytest -q tests/test_demo_browser.py

      - name: Demo target log
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/formwise-demo-e2e.log" || cat "$RUNNER_TEMP/formwise-demo-e2e.log"
